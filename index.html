<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Search</title>
    <script type="module" crossorigin src="/image-search-app/index.js"></script>
    <link rel="modulepreload" crossorigin href="/image-search-app/assets/vendor-DcHCnVjq.js">
    <link rel="stylesheet" crossorigin href="/image-search-app/assets/vendor-DumFYO8Z.css">
    <link rel="stylesheet" crossorigin href="/image-search-app/assets/index-DKY9lr6Z.css">
  </head>

  <body>
    <main class="container">
      <form class="search-form">
        <input
          class="search-input"
          type="text"
          name="search-text"
          placeholder="Search images..."
          autocomplete="off"
        />
        <button class="search-btn" type="submit">Search</button>
      </form>

      <div class="loader is-hidden">
        <span class="loader-text">Loading images, please wait...</span>
      </div>

      <ul class="gallery"></ul>

      <button class="load-more is-hidden" type="button">Load more</button>

      <p class="end-message is-hidden">
        We're sorry, but you've reached the end of search results.
      </p>
    </main>

  </body>
</html>
